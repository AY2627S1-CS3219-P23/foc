name: foc

services:
  # Web frontend (issue #108): the single React SPA, built with Vite and
  # served as static files by nginx. No depends_on — the shell makes no
  # API calls yet, and a static frontend shouldn't gate on backends.
  # The VITE_* args are browser-visible URLs (never compose-internal
  # hostnames); changing one requires an image rebuild. Since the gateway
  # cutover (issue #151) they all point at the gateway's host port with a
  # per-service path prefix, e.g. http://localhost:8090/api/user.
  # All default empty here — values live in .env (see .env.example).
  web:
    build:
      context: web
      args:
        # Defaults track the gateway (PR #176 review, @Sinnez1): an
        # unset variable no longer produces a dead bundle. A STALE
        # value still wins over these — after pulling the cutover,
        # update (or delete) the five VITE_* lines in your .env to the
        # gateway prefixes in .env.example, or every API call fails as
        # a CORS-blocked connection error.
        VITE_USER_SERVICE_URL: ${VITE_USER_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/user}
        VITE_SUPPLIER_SERVICE_URL: ${VITE_SUPPLIER_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/supplier}
        VITE_ORDER_SERVICE_URL: ${VITE_ORDER_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/order}
        VITE_CREDIT_SERVICE_URL: ${VITE_CREDIT_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/credit}
        VITE_NOTIFICATION_SERVICE_URL: ${VITE_NOTIFICATION_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/notification}
        VITE_RATING_SERVICE_URL: ${VITE_RATING_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/rating}
        VITE_CHAT_SERVICE_URL: ${VITE_CHAT_SERVICE_URL:-http://localhost:${GATEWAY_PORT:-8090}/api/chat}
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

  # API gateway (issue #151, docs/gateway.md): the single entry point for
  # all backend APIs. Verifies bearer JWTs (HS256 + exp) and rejects
  # denylisted jtis by checking redis in-process (OpenResty/Lua);
  # anonymous requests pass through for the services' own rules to
  # answer. Backends have no published host ports — the gateway is the
  # only way in, so revocation cannot be bypassed from the browser.
  gateway:
    build:
      context: gateway
    ports:
      - "${GATEWAY_PORT:-8090}:8080"
    environment:
      # the same platform secret the services verify with
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # stamped onto gateway-origin 401s so the browser can read them
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
    # No redis dependency on purpose (PR #176 Copilot review): the
    # denylist check fails open at request time (G6), so gating startup
    # on Redis health would block even valid traffic exactly when the
    # design says to keep serving it.
    depends_on:
      # start order only — per-request DNS keeps routing if one restarts
      user-service:
        condition: service_started
      supplier-service:
        condition: service_started
      credit-service:
        condition: service_started
      notification-service:
        condition: service_started
      rating-service:
        condition: service_started
      chat-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    # Context is the repo root so the build can include the shared
    # foc-contracts library (D15).
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PORT: "5432"
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      NOTIFICATION_RETRY_TTL_MS: ${NOTIFICATION_RETRY_TTL_MS:-10000}
      NOTIFICATION_RETRY_MAX_ATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:-3}
      NOTIF_RETENTION_DAYS: ${NOTIF_RETENTION_DAYS:-30}
      NOTIF_PURGE_CRON: "${NOTIF_PURGE_CRON:-0 0 3 * * *}"
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      NOTIFICATION_WS_ALLOWED_ORIGINS: ${NOTIFICATION_WS_ALLOWED_ORIGINS:-http://localhost:*}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
      # Platform Redis: denylist read at STOMP CONNECT (D23). No
      # depends_on redis on purpose — the check fails open (G6).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # RabbitMQ broker (D1): shared platform infrastructure, usable by any
  # service. Runs with a named volume for its data directory (M7) so
  # durable queues and persistent messages survive broker restarts (D8,
  # Notif NFR1.2). Management UI included for DLQ inspection (D7).
  rabbitmq:
    image: rabbitmq:4-management
    # Pinned hostname: RabbitMQ derives its node name (and the on-disk
    # data location inside the volume) from the hostname, so an
    # unpinned hostname would strand the persisted data when the
    # container is recreated (docker compose down && up).
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Notification DB (D3): PostgreSQL owned exclusively by the
  # notification service (database-per-service).
  notification-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only — a bare "5433:5432"
    # would listen on every interface and expose it to the LAN.
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification} -d ${NOTIFICATION_DB_NAME:-notification}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  supplier-service:
    # Context is the repo root (repo compose convention), even though
    # this service has no shared-library build stage yet.
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    environment:
      SUPPLIER_DB_HOST: supplier-db
      SUPPLIER_DB_PORT: "5432"
      SUPPLIER_DB_NAME: ${SUPPLIER_DB_NAME:-supplier}
      SUPPLIER_DB_USER: ${SUPPLIER_DB_USER:-supplier}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?set in .env}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
    depends_on:
      supplier-db:
        condition: service_healthy
    restart: unless-stopped

  # Supplier DB: PostgreSQL owned exclusively by the supplier service
  # (database-per-service).
  supplier-db:
    image: postgres:16
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only.
    ports:
      - "127.0.0.1:${SUPPLIER_DB_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${SUPPLIER_DB_NAME:-supplier}
      POSTGRES_USER: ${SUPPLIER_DB_USER:-supplier}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD:?set in .env}
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPPLIER_DB_USER:-supplier} -d ${SUPPLIER_DB_NAME:-supplier}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  user-service:
    # Context is the repo root (see the Dockerfile) so the shared
    # foc-contracts library can be built alongside the service.
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      USER_DB_HOST: user-db
      USER_DB_PORT: "5432"
      USER_DB_NAME: ${USER_DB_NAME:-user}
      USER_DB_USER: ${USER_DB_USER:-user}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      # Shared secret gating POST /auth/setup-owner (issue #97); the
      # endpoint answers 503 while it is unset.
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:-}
      # Recovery window / purge cadence for soft-deleted accounts
      # (issue #93, day-31 purge scheduler).
      USER_RETENTION_DAYS: ${USER_RETENTION_DAYS:-30}
      USER_PURGE_CRON: "${USER_PURGE_CRON:-0 0 3 * * *}"
      # "true" seeds the demo accounts (local testing only; see .env.example)
      USER_SEED_DEMO: ${USER_SEED_DEMO:-false}
      # Signs login tokens (issue #90); the same secret the other services
      # verify with.
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}
      # Browser origin allowed by CORS, shared with supplier-service.
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
      # Where the account-purge job removes a purged account's supplier
      # bookmarks (issue #225): supplier-service directly, not the gateway.
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_URL:-http://supplier-service:8080}
      # OTP email delivery (issue #88). Defaults reach the mailpit
      # container; the Gmail values in .env.example switch to real
      # delivery. Empty credentials are fine — Mailpit needs none.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@foc.local}
      OTP_TTL: ${OTP_TTL:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN:-60s}
      # Logout writes denylist:<jti> TTL keys here (issue #151); the API
      # gateway is what reads them on every request.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # user.created / user.purged go out through here (issue #267)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
    # No redis dependency on purpose (PR #176 Copilot review): the
    # logout write is best-effort (G9, finite 2 s timeouts), so the
    # whole service must not wait on — or fail with — Redis. No rabbitmq
    # one either (issue #267): the outbox keeps the user events until the
    # broker is reachable.
    depends_on:
      user-db:
        condition: service_healthy
      # vestigial once .env points MAIL_HOST at Gmail, but harmless
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Platform Redis (issue #151): holds the logout token denylist as
  # denylist:<jti> keys that expire with the token itself (no purge job
  # needed). Written by the user service at logout, read by the API
  # gateway on every request. AOF + volume so revoked-but-unexpired
  # tokens stay revoked across container restarts (team decision).
  redis:
    # Minor-pinned like the DB images (PR #150 convention).
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Published on the host for local tooling (redis-cli), loopback-bound
    # like the DBs: this machine only.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # User DB: PostgreSQL owned exclusively by the user service
  # (database-per-service).
  user-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only.
    ports:
      - "127.0.0.1:${USER_DB_HOST_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user}
      POSTGRES_USER: ${USER_DB_USER:-user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user} -d ${USER_DB_NAME:-user}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  credit-service:
    # Context is the repo root so the build can include the shared
    # foc-contracts library (D15).
    build:
      context: .
      dockerfile: credit-service/Dockerfile
    environment:
      CREDIT_DB_HOST: credit-db
      CREDIT_DB_PORT: "5432"
      CREDIT_DB_NAME: ${CREDIT_DB_NAME:-credit}
      CREDIT_DB_USER: ${CREDIT_DB_USER:-credit}
      CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD:?set in .env}
      # the saga's request and credit events (docs/credit-service.md)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      # retry delay and attempts for a failed request event (D11)
      CREDIT_RETRY_TTL_MS: ${CREDIT_RETRY_TTL_MS:-2000}
      CREDIT_RETRY_MAX_ATTEMPTS: ${CREDIT_RETRY_MAX_ATTEMPTS:-5}
      # confirm wait for a retry copy, and the pause before a requeue
      CREDIT_RETRY_CONFIRM_TIMEOUT_MS: ${CREDIT_RETRY_CONFIRM_TIMEOUT_MS:-5000}
      # sign-up credits and earned-credit lifetime (D6, D4)
      CREDIT_SIGN_UP_CREDITS: ${CREDIT_SIGN_UP_CREDITS:-5}
      CREDIT_EARNED_CREDIT_LIFETIME_MONTHS: ${CREDIT_EARNED_CREDIT_LIFETIME_MONTHS:-3}
      # how long a sent reply stays in the outbox, and when it is purged (D13)
      CREDIT_OUTBOX_RETENTION_DAYS: ${CREDIT_OUTBOX_RETENTION_DAYS:-30}
      CREDIT_OUTBOX_PURGE_CRON: "${CREDIT_OUTBOX_PURGE_CRON:-0 0 3 * * *}"
      # verifies login tokens; the secret user-service signs them with
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # Browser origin allowed by CORS, shared with the other services.
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      credit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Credit DB: PostgreSQL owned exclusively by the credit service
  # (database-per-service). Flyway in the service owns the schema.
  credit-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only.
    ports:
      - "127.0.0.1:${CREDIT_DB_HOST_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: ${CREDIT_DB_NAME:-credit}
      POSTGRES_USER: ${CREDIT_DB_USER:-credit}
      POSTGRES_PASSWORD: ${CREDIT_DB_PASSWORD:?set in .env}
    volumes:
      - credit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CREDIT_DB_USER:-credit} -d ${CREDIT_DB_NAME:-credit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-service:
    # Context is the repo root so the build can include the shared
    # foc-contracts library (D15).
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: "5432"
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order}
      ORDER_DB_USER: ${ORDER_DB_USER:-order}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      # the saga's request events and the Credit Service's replies
      # (docs/credit-service.md)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      # how long a request may stay PENDING, and how often that is checked
      ORDER_PENDING_TIMEOUT_MS: ${ORDER_PENDING_TIMEOUT_MS:-30000}
      ORDER_PENDING_SWEEP_INTERVAL_MS: ${ORDER_PENDING_SWEEP_INTERVAL_MS:-15000}
      # retry delay and attempts for a failed credit reply
      ORDER_RETRY_TTL_MS: ${ORDER_RETRY_TTL_MS:-2000}
      ORDER_RETRY_MAX_ATTEMPTS: ${ORDER_RETRY_MAX_ATTEMPTS:-5}
      # deadline-expiry and auto-complete sweeps (F6.1, F7.2)
      ORDER_EXPIRY_SWEEP_INTERVAL_MS: ${ORDER_EXPIRY_SWEEP_INTERVAL_MS:-300000}
      ORDER_AUTO_COMPLETE_AFTER_MS: ${ORDER_AUTO_COMPLETE_AFTER_MS:-3600000}
      ORDER_AUTO_COMPLETE_SWEEP_INTERVAL_MS: ${ORDER_AUTO_COMPLETE_SWEEP_INTERVAL_MS:-300000}
      # chat-service's open/close calls (N6, C11/C12)
      CHAT_SERVICE_URL: http://chat-service:8080
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:?set in .env}
      # how long after its deadline a still-COLLECTED request is disputed
      # by the expiry sweep (DSP-6)
      ORDER_DISPUTE_ESCALATION_GRACE_MS: ${ORDER_DISPUTE_ESCALATION_GRACE_MS:-3600000}
      # verifies the caller's bearer token for the ownership checks
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # the SPA's origin, for CORS
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Order DB: PostgreSQL owned exclusively by the order service
  # (database-per-service).
  order-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only.
    ports:
      - "127.0.0.1:${ORDER_DB_HOST_PORT:-5437}:5432"
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order}
      POSTGRES_USER: ${ORDER_DB_USER:-order}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-order} -d ${ORDER_DB_NAME:-order}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rating-service:
    # Context is the repo root so the build can include the shared
    # foc-contracts library (D15).
    build:
      context: .
      dockerfile: rating-service/Dockerfile
    environment:
      RATING_DB_HOST: rating-db
      RATING_DB_PORT: "5432"
      RATING_DB_NAME: ${RATING_DB_NAME:-rating}
      RATING_DB_USER: ${RATING_DB_USER:-rating}
      RATING_DB_PASSWORD: ${RATING_DB_PASSWORD:?set in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-foc}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
      RATING_RETRY_TTL_MS: ${RATING_RETRY_TTL_MS:-10000}
      RATING_RETRY_MAX_ATTEMPTS: ${RATING_RETRY_MAX_ATTEMPTS:-3}
      RATING_RETRY_CONFIRM_TIMEOUT_MS: ${RATING_RETRY_CONFIRM_TIMEOUT_MS:-5000}
      # verifies the caller's bearer token
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # the SPA's origin, for CORS
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      rating-db:
        condition: service_healthy
      # a pure consumer: the startup initializer declares its queues
      # against the broker, so wait for it (notification-service pattern)
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Rating DB: PostgreSQL owned exclusively by the rating service
  # (database-per-service).
  rating-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; the service itself talks
    # to it over the compose network on 5432. Bound to loopback so the
    # database is reachable from this machine only.
    ports:
      - "127.0.0.1:${RATING_DB_HOST_PORT:-5438}:5432"
    environment:
      POSTGRES_DB: ${RATING_DB_NAME:-rating}
      POSTGRES_USER: ${RATING_DB_USER:-rating}
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD:?set in .env}
    volumes:
      - rating-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RATING_DB_USER:-rating} -d ${RATING_DB_NAME:-rating}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Chat service (N6, docs/chat-service.md): requester-courier chat with
  # its own STOMP WebSocket, reached through the gateway at /api/chat/**.
  # order-service opens and closes chats over /internal/** with the
  # shared CHAT_INTERNAL_TOKEN. No depends_on redis: the CONNECT denylist
  # check fails open (C15), as notification-service's does.
  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      CHAT_DB_HOST: chat-db
      CHAT_DB_PORT: "5432"
      CHAT_DB_NAME: ${CHAT_DB_NAME:-chat}
      CHAT_DB_USER: ${CHAT_DB_USER:-chat}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:5173}
      CHAT_WS_ALLOWED_ORIGINS: ${CHAT_WS_ALLOWED_ORIGINS:-http://localhost:*}
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:?set in .env}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      CHAT_PURGE_CRON: "${CHAT_PURGE_CRON:-0 0 3 * * *}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      chat-db:
        condition: service_healthy
    restart: unless-stopped

  # Chat DB: PostgreSQL owned exclusively by the chat service
  # (database-per-service). Holds the messages and their images (C9).
  chat-db:
    image: postgres:17
    # Published on the host so local tooling (psql, DB GUIs, the postgres
    # MCP server) can reach the service-owned DB; bound to loopback so it
    # is reachable from this machine only.
    ports:
      - "127.0.0.1:${CHAT_DB_HOST_PORT:-5439}:5432"
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-chat}
      POSTGRES_USER: ${CHAT_DB_USER:-chat}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:?set in .env}
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_DB_USER:-chat} -d ${CHAT_DB_NAME:-chat}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local mail catcher (issue #88): the default SMTP target for the user
  # service's OTP emails, so dev and demo need no real mail account.
  # Caught mail is browsable at http://localhost:8025; the store is
  # in-memory on purpose — a dev inbox has nothing worth persisting.
  # Both ports loopback-bound like the DBs: this machine only.
  mailpit:
    # Minor-pinned like the DB images (PR #150 Copilot review), so a
    # future Mailpit release can't change the demo stack unannounced.
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

# Other services add their own entries in their own PRs.

volumes:
  chat-db-data:
  credit-db-data:
  notification-db-data:
  order-db-data:
  rabbitmq-data:
  rating-db-data:
  redis-data:
  supplier-db-data:
  user-db-data:
