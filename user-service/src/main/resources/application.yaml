# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Fable 5), 2026-09-20.
# Scope: scaffolded for issue #84. Application name and health endpoint
# only (scope chosen by Leong Wei Zhi via options Q&A); datasource
# config arrives with issue #86.
# 2026-09-23 (Ryan Ang, Claude Sonnet 4.6): owner.setup.token property added for
# the owner-bootstrap setup-token gate (issue #97).
# 2026-09-23, Claude Code (Fable 5), issue #86: datasource bound to the
# service-owned user-db and JPA schema-from-entities, following the
# supplier/notification pattern. Tests are unaffected: Testcontainers
# @ServiceConnection overrides the datasource there.
# 2026-09-25 (Ryan Ang, Claude Code (Opus 5.5)): owner.setup.token comment
# updated; setup no longer stops after the first owner.
# 2026-09-27, Claude Code (Fable 5), issue #93: user.retention bindings for
# the day-31 account purge scheduler, mirroring notification-service's
# retention config shape.
# 2026-09-29, Claude Code (Opus 5.5), issues #87/#89/#90: user.jwt (login
# token signing, design doc §3) and user.web-allowed-origin (CORS, reusing
# supplier-service's WEB_ALLOWED_ORIGIN variable).
# 2026-09-29, Claude Code (Fable 5), issue #88: spring.mail + user.mail/
# user.otp for OTP email sending. Defaults target the compose Mailpit
# container; Gmail SMTP (the chosen provider) is switched on via the
# MAIL_* values documented in .env.example. PR #150 Copilot review:
# finite SMTP timeouts so a stalled endpoint can't pin request threads.
# Reviewed by: Leong Wei Zhi (via pull request).

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:user}
    username: ${USER_DB_USER:user}
    password: ${USER_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    # SMTP target for OTP emails (issue #88). The defaults reach the
    # compose Mailpit container (web inbox: http://localhost:8025); for
    # real delivery set the Gmail values from .env.example. Unlike
    # JWT_SECRET, empty credentials are legitimate — Mailpit is
    # unauthenticated — so nothing fails loudly here.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "mail.smtp.auth": ${MAIL_SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${MAIL_SMTP_STARTTLS:false}
      # Finite timeouts (ms): the send runs inside the signup request,
      # so a stalled SMTP endpoint must fail (502) rather than hold the
      # request thread and its DB connection open indefinitely.
      "mail.smtp.connectiontimeout": "5000"
      "mail.smtp.timeout": "10000"
      "mail.smtp.writetimeout": "10000"

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Don't let an SMTP outage mark the whole service down: everything
      # but the email flows keeps working, and a failed send already
      # surfaces as a 502 on sign-up (issue #88).
      enabled: false

user:
  retention:
    # Soft-deleted accounts keep their row — and so their unique email/
    # username — for this many days (design doc §2: 30-day reuse block).
    # The purge scheduler hard-deletes them, with their account_tokens
    # rows, once deleted_at is older than this ("purge on day 31").
    days: ${USER_RETENTION_DAYS:30}
    # Cron schedule (Spring's 6-field format) controlling how often the
    # purge sweep runs. Default: daily at 03:00 server time.
    purge-cron: "${USER_PURGE_CRON:0 0 3 * * *}"
  jwt:
    # Shared HS256 secret (at least 32 bytes) that every service verifies
    # tokens with. Empty default: startup fails with a clear message
    # until JWT_SECRET is set.
    secret: ${JWT_SECRET:}
    # Login token lifetime (design doc §3: exp = 1 hour after issue).
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  # Browser origin allowed by CORS (the web SPA).
  web-allowed-origin: ${WEB_ALLOWED_ORIGIN:http://localhost:5173}
  mail:
    # From-address on OTP emails. With Gmail SMTP this must equal
    # MAIL_USERNAME (Gmail rewrites anything else).
    from: ${MAIL_FROM:no-reply@foc.local}
  otp:
    # Sign-up verification code lifetime, as a Spring duration (10m); a
    # bare number is seconds (OTP_TTL=600 is 10 min).
    ttl: ${OTP_TTL:10m}
    # Wrong codes allowed before the pending sign-up is discarded and a
    # fresh sign-up is required (mirrors the login lockout's 5).
    max-attempts: ${OTP_MAX_ATTEMPTS:5}

owner:
  setup:
    # Shared secret required to call POST /auth/setup-owner. Must be set via
    # the OWNER_SETUP_TOKEN env var before first deploy. Setup is disabled
    # (503) while it is unset, so the endpoint can't be reached. Each call
    # with the token creates another OWNER.
    token: ${OWNER_SETUP_TOKEN:}
