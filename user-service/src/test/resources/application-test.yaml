owner:
  setup:
    token: test-owner-setup-token

user:
  jwt:
    # the main yaml's default is empty, which fails startup
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
  otp:
    # off here: the sign-up tests resend back to back, and no clock they
    # can advance sits between the two calls. The cooldown itself is
    # covered by AuthServiceTest (fixed clock) and SignupResendCooldownTest
    # (which overrides this to the real default).
    resend-cooldown: 0s
