# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Sonnet 4.6), 2026-09-22; setup token added 2026-09-23.
# Scope: test-only config: ddl-auto create-drop so the Testcontainers
# Postgres has the users table, plus a fixed owner setup token for the
# controller tests.
# Author review: Ryan ran mvn test and confirmed the suite is green.
# 2026-09-27, Claude Code (Fable 5), issue #93: user.retention values for
# the purge scheduler bean (30-day window; cron irrelevant in tests, which
# call the purge method directly).
# 2026-09-29, Claude Code (Opus 5.5), issues #87/#89/#90: fixed JWT secret
# and TTL for the auth tests, and the CORS origin.

spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: create-drop

owner:
  setup:
    token: test-owner-setup-token

user:
  retention:
    days: 30
    purge-cron: "0 0 3 * * *"
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
    access-token-ttl: 1h
  web-allowed-origin: http://localhost:5173
