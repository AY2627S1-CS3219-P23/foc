# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Sonnet 4.6), 2026-09-22; setup token added 2026-09-23.
# Scope: test-only config: ddl-auto create-drop so the Testcontainers
# Postgres has the users table, plus a fixed owner setup token for the
# controller tests.
# Author review: Ryan ran mvn test and confirmed the suite is green.
# 2026-09-27, Claude Code (Fable 5), issue #93: user.retention values for
# the purge scheduler bean (30-day window; cron irrelevant in tests, which
# call the purge method directly).
# 2026-09-29, Claude Code (Opus 5.5), issues #87/#89/#90: fixed JWT secret
# and TTL for the auth tests, and the CORS origin.
# 2026-09-29, Claude Code (Opus 5), PR #150 review: otp.resend-cooldown
# added (0s here — see the comment on it).
# 2026-09-29, Claude Code (Fable 5), issue #88: mail/otp values so the
# context builds with spring-boot-starter-mail on the classpath (this file
# fully shadows the main yaml). The JavaMailSender bean never connects in
# tests — OtpEmailSender is mocked where sending would happen.
# 2026-09-29, Claude Code (Opus 5.5), issue #147: ddl-auto none, so the
# Testcontainers database gets its schema from the Flyway migrations.

spring:
  application:
    name: user-service
  jpa:
    hibernate:
      # schema from the Flyway migrations, as in production
      ddl-auto: none
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      # as in the main yaml: no SMTP listener should not fail /actuator/health
      enabled: false

owner:
  setup:
    token: test-owner-setup-token

user:
  retention:
    days: 30
    purge-cron: "0 0 3 * * *"
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
    access-token-ttl: 1h
  web-allowed-origin: http://localhost:5173
  mail:
    from: no-reply@foc.local
  otp:
    ttl: 10m
    max-attempts: 5
    # off here: the sign-up tests resend back to back, and no clock they
    # can advance sits between the two calls. The cooldown itself is
    # covered by AuthServiceTest (fixed clock) and SignupResendCooldownTest
    # (which overrides this to the real default).
    resend-cooldown: 0s
