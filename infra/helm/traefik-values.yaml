# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Fable 5.1), 2026-11-09, issue #48 (EKS re-platform).
# Scope: values for the Traefik Helm chart (traefik/traefik 42.3.1) that
# deploy.sh installs as the ingress controller (team decision DP15, Leong
# Wei Zhi, 2026-11-09, options Q&A, recorded in docs/deployment.md): a
# NodePort Service the load balancer's target group points at, and the
# timeouts that keep the STOMP WebSockets open (the cloud-init values of
# the k3s host, docs/gateway.md). The Ingress in infra/k8s/ingress.yaml
# keeps ingressClassName traefik.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP21, Leong
# Wei Zhi, options Q&A): two replicas, a PodDisruptionBudget and the same
# soft per-node spread as the Deployments.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP22, Leong
# Wei Zhi, options Q&A): the spread is hard and per node pool, so exactly
# one replica runs on the on-demand node.
# Author review: Leong Wei Zhi, pending pull request review.
# two replicas so a node loss does not cut every request; a drain evicts
# one at a time
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# one replica on the on-demand node and one on Spot, never both on the
# same pool (DP22): a Spot interruption leaves the on-demand one serving.
# When no Spot node has room, the Spot replica stays Pending
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: foc.dev/pool
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

# every node answers this port; infra/terraform (local.traefik_node_port)
# and the cluster security group rule use the same number
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
    # Traefik's 60 s read timeout would cut the long-lived STOMP sockets
    # the gateway holds open for 3600 s (docs/gateway.md); the load
    # balancer closes idle connections at 3500 s, before this does
    transport:
      respondingTimeouts:
        readTimeout: 0s
        idleTimeout: 3600s
  # TLS ends at the load balancer: no https entry point is published
  websecure:
    expose:
      default: false

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    # the Ingress status is not written back (no LoadBalancer Service here)
    publishedService:
      enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
