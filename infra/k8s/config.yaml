apiVersion: v1
kind: ConfigMap
metadata:
  name: foc-config
  namespace: foc
data:
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: foc
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  WEB_ALLOWED_ORIGIN: "https://__PUBLIC_HOST__"
  # heap sized from the container memory limit
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
