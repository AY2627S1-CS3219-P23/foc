# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-10, issue #48 (N5 cloud deployment).
# Scope: the nine ClusterIP Services, moved here from apps/*.yaml when
# every Deployment split into -spot and -stable (team decision DP22,
# Leong Wei Zhi, options Q&A, recorded in docs/deployment.md). Each
# selects app only, so it routes to the replicas of both pools.
# Author review: Leong Wei Zhi, pending pull request review.
