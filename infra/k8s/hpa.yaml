# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: HPA min 1 / max 2 on CPU for every Deployment (team decision;
# k3s ships metrics-server). The services' scheduled jobs run on both
# replicas, accepted as idempotent; chat and notification fan their STOMP
# pushes out over AMQP so a push reaches the replica holding the socket
# (docs/deployment.md, DP10; issue #305).
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: header corrected
# to DP10 (no hardening; behaviour at 2 replicas accepted). Same day,
# review follow-up: the chat and notification HPAs removed (one replica
# each, issue #305).
# 2026-11-08, Claude Code (Fable 5.1), issue #305 (team decision, Leong Wei
# Zhi via options Q&A): the chat and notification HPAs back, same values.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform): CPU
# metrics come from the EKS metrics-server add-on; two t3a.medium Spot nodes fit HPA
# max 2 only in part until the third node is added (docs/deployment.md,
# scaling).
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: foc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
