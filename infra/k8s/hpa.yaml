# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: HPAs on CPU 70 % for every Deployment: the seven backends min 2 /
# max 3, gateway and web min 1 / max 2 (DP9, revised 2026-11-10; min 1 /
# max 2 everywhere before). The services' scheduled jobs run on both
# replicas, accepted as idempotent; chat and notification fan their STOMP
# pushes out over AMQP so a push reaches the replica holding the socket
# (docs/deployment.md, DP10; issue #305).
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: header corrected
# to DP10 (no hardening; behaviour at 2 replicas accepted). Same day,
# review follow-up: the chat and notification HPAs removed (one replica
# each, issue #305).
# 2026-11-08, Claude Code (Fable 5.1), issue #305 (team decision, Leong Wei
# Zhi via options Q&A): the chat and notification HPAs back, same values.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform): CPU
# metrics come from the EKS metrics-server add-on. The nodes (2 Spot + 1
# on-demand t3a.medium) fit every HPA minimum but not every maximum at
# once (docs/deployment.md, scaling).
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision, Leong Wei
# Zhi, options Q&A): the seven backends run HPA min 2 / max 3 (DP9), so a
# node loss leaves one replica answering when the soft spread placed the
# two apart (best effort, DP21); gateway and web stay 1 to 2. The
# backends' PodDisruptionBudgets are in pdb.yaml (DP21).
# Author review: Leong Wei Zhi, pending pull request review.
# PR #323 review (Copilot): scope line and node-fit note corrected.
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: foc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
