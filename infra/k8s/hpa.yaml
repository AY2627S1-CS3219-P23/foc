# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: HPA min 1 / max 2 on CPU for every Deployment (team decision;
# k3s ships metrics-server). Two replicas rely on the multi-replica
# backend changes (ShedLock, STOMP fanout, ...) of the issue #48 stack.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/architecture.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: foc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
