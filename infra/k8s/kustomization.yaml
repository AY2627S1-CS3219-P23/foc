# Author review: Leong Wei Zhi, pending pull request review.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespaces are set per manifest; secrets.sh applies namespace.yaml on
# its own first, so the Secrets it writes have somewhere to go
resources:
  - namespace.yaml
  - config.yaml
  - data/postgres.yaml
  - data/rabbitmq.yaml
  - data/redis.yaml
  - apps/user-service.yaml
  - apps/supplier-service.yaml
  - apps/order-service.yaml
  - apps/credit-service.yaml
  - apps/notification-service.yaml
  - apps/rating-service.yaml
  - apps/chat-service.yaml
  - apps/gateway.yaml
  - apps/web.yaml
  - ingress.yaml
  - hpa.yaml
# __IMAGE_TAG__ is replaced by deploy.sh with the commit SHA
images:
  - name: ghcr.io/ay2627s1-cs3219-p23/foc-user-service
    newTag: __IMAGE_TAG__
  - name: ghcr.io/ay2627s1-cs3219-p23/foc-supplier-service
    newTag: __IMAGE_TAG__
