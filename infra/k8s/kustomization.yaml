# through pools/spot and pools/stable.
# Author review: Leong Wei Zhi, pending pull request review.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespaces are set per manifest; secrets.sh applies namespace.yaml on
# its own first, so the Secrets it writes have somewhere to go. Traefik
# is not here: deploy.sh installs its Helm chart (infra/helm)
resources:
  - namespace.yaml
  - config.yaml
  - data/storageclass.yaml
  - data/rabbitmq.yaml
  - data/redis.yaml
  - services.yaml
  # every Deployment twice: <svc>-spot and <svc>-stable (DP22)
  - pools/spot
  - pools/stable
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
# __IMAGE_TAG__ is replaced by deploy.sh with the commit SHA
images:
  - name: ghcr.io/ay2627s1-cs3219-p23/foc-user-service
    newTag: __IMAGE_TAG__
  - name: ghcr.io/ay2627s1-cs3219-p23/foc-supplier-service
    newTag: __IMAGE_TAG__
  - name: ghcr.io/ay2627s1-cs3219-p23/foc-order-service
