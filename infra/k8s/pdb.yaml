# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-10, issue #48 (N5 cloud deployment).
# Scope: one PodDisruptionBudget per backend Deployment, minAvailable 1, so
# a voluntary drain (a Spot rebalance or interruption, a node group update)
# evicts one replica at a time. Team decision DP21 (Leong Wei Zhi, options
# Q&A, recorded in docs/deployment.md).
# Author review: Leong Wei Zhi, pending pull request review.
# gateway and web have none: they run one replica at rest, and minAvailable 1
# on a single replica would never allow an eviction, stalling every drain
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: foc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service
---
