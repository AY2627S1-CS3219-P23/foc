# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-10, issue #48 (N5 cloud deployment).
# Scope: one PodDisruptionBudget per backend Deployment, so a voluntary
# drain (a Spot rebalance or interruption, a node group update) evicts one
# replica at a time. Team decision DP21 (Leong Wei Zhi, options Q&A,
# recorded in docs/deployment.md).
# Author review: Leong Wei Zhi, pending pull request review.
# PR #323 review (Copilot), team decision (Leong Wei Zhi): maxUnavailable 1
# instead of minAvailable 1, which allowed two evictions at 3 replicas.
# Author review: Leong Wei Zhi, pending pull request review.
# maxUnavailable counts against the HPA's desired count: while a replica is
# Pending (2 of 3 running, or 1 of 2) no eviction is allowed and a drain
# waits. gateway and web have none: they run one replica at rest, and a
# budget on a single replica would never allow an eviction
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: foc
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: user-service
---
