# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: order-service Deployment + ClusterIP Service; env as in compose.yaml
# with cloud values (in-cluster hostnames, public origin, Gmail SMTP
# for user-service), secrets from the ESO-synced foc-secrets.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: the pod template
# carries the foc-secrets version as an annotation (set by deploy.sh).
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foc
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
---
# no replicas: the HorizontalPodAutoscaler in hpa.yaml owns the count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: order-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-order-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: ORDER_DB_HOST
              value: "order-db"
            - name: ORDER_DB_PORT
              value: "5432"
            - name: ORDER_DB_NAME
              value: "order"
            - name: ORDER_DB_USER
              value: "order"
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: ORDER_DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            - name: ORDER_PENDING_TIMEOUT_MS
              value: "30000"
            - name: ORDER_PENDING_SWEEP_INTERVAL_MS
              value: "15000"
            - name: ORDER_RETRY_TTL_MS
              value: "2000"
            - name: ORDER_RETRY_MAX_ATTEMPTS
              value: "5"
            - name: ORDER_EXPIRY_SWEEP_INTERVAL_MS
              value: "300000"
            - name: ORDER_AUTO_COMPLETE_AFTER_MS
              value: "3600000"
            - name: ORDER_AUTO_COMPLETE_SWEEP_INTERVAL_MS
              value: "300000"
            - name: ORDER_DISPUTE_ESCALATION_GRACE_MS
              value: "3600000"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:8080"
            - name: CHAT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: CHAT_INTERNAL_TOKEN
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
