# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: supplier-service Deployment + ClusterIP Service; env as in compose.yaml
# with cloud values (in-cluster hostnames, public origin, Gmail SMTP
# for user-service), secrets from the ESO-synced foc-secrets.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: supplier-service
  namespace: foc
spec:
  selector:
    app: supplier-service
  ports:
    - port: 8080
---
# no replicas: the HorizontalPodAutoscaler in hpa.yaml owns the count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: supplier-service
  template:
    metadata:
      labels:
        app: supplier-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: supplier-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-supplier-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: SUPPLIER_DB_HOST
              value: "supplier-db"
            - name: SUPPLIER_DB_PORT
              value: "5432"
            - name: SUPPLIER_DB_NAME
              value: "supplier"
            - name: SUPPLIER_DB_USER
              value: "supplier"
            - name: SUPPLIER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: SUPPLIER_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
