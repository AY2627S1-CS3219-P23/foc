# Hikari pool is capped at 5 (DP19).
# Author review: Leong Wei Zhi, pending pull request review.
# PR #316 review (Claude reviewer): Hikari keeps one idle connection
# (team decision DP19, Leong Wei Zhi). Author review: Leong Wei Zhi,
# pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP21,
# Leong Wei Zhi, options Q&A): soft spread of the replicas across nodes;
# HPA min 2 / max 3 (DP9), Hikari note updated (DP19).
# Author review: Leong Wei Zhi, pending pull request review.
# PR #323 review (Copilot), team decision DP21 (Leong Wei Zhi): rolling
# update without surge (maxSurge 0, maxUnavailable 1).
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP22,
# Leong Wei Zhi, options Q&A): the Service moved to services.yaml; this
# Deployment is the base that pools/spot (-spot, HPA 1 to 2) and
# pools/stable (-stable, one replica on the on-demand node) render;
# CPU request 150m (was 200m).
# Author review: Leong Wei Zhi, pending pull request review.
---
# no replicas: pools/stable sets 1, and the HorizontalPodAutoscaler in
# hpa.yaml owns the -spot count (DP22)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: supplier-service
  # no surge pod: a rollout replaces one replica at a time, so it never
  # needs memory or database connections beyond HPA max (DP21, PR #323
  # review)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: supplier-service
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      # replicas prefer different nodes, but still schedule when only one
      # node has room (DP21); pod-template-hash keeps a rollout's old
      # pods out of the count
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: supplier-service
          matchLabelKeys:
            - pod-template-hash
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: supplier-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-supplier-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: SUPPLIER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: DB_HOST
            - name: SUPPLIER_DB_PORT
              value: "5432"
            - name: SUPPLIER_DB_NAME
              value: "supplier"
            - name: SUPPLIER_DB_USER
              value: "supplier"
            - name: SUPPLIER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: SUPPLIER_DB_PASSWORD
            # seven services share one db.t4g.micro (max_connections about
            # 110): 7 x 5 x 3 replicas (1 stable +
            # HPA max 2) is 105, accepted; a rollout
            # adds no surge pod (strategy below, DP21), and one idle
            # connection per pod keeps a fresh pod light (DP19)
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
          resources:
            requests:
              # 150m since DP22: one replica of every service shares the
              # on-demand node's 2 vCPU with RabbitMQ, Redis and Traefik
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
