# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: chat-service Deployment + ClusterIP Service; env as in compose.yaml
# with cloud values (in-cluster hostnames, public origin, Gmail SMTP
# for user-service), secrets from foc-secrets.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: the pod template
# carries the foc-secrets version as an annotation (set by deploy.sh);
# second round (Sinnez1): the foc-config hash too.
# Author review: Leong Wei Zhi, pending pull request review.
# Same day, review follow-up: replicas pinned to 1 (DP10, issue #305).
# Same day, issue #48 (HTTPS): the WebSocket origin is https (DP19, DP21).
# 2026-11-08, Claude Code (Fable 5.1), issue #305 (team decision, Leong Wei
# Zhi via options Q&A): the pin removed — pushes fan out over AMQP, so the
# HPA scales this Deployment like the others (DP9/DP10). PR #306 Copilot
# review: RABBITMQ_PASSWORD from foc-secrets, which the first cut missed.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform): the
# HTTPS decisions cited above are DP17 and DP18 since docs/deployment.md was
# renumbered; no value changed here.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform):
# CHAT_DB_HOST comes from foc-secrets (the one RDS instance, DP4) and the
# Hikari pool is capped at 5 (DP19).
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: foc
spec:
  selector:
    app: chat-service
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: chat-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-chat-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: CHAT_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: DB_HOST
            - name: CHAT_DB_PORT
              value: "5432"
            - name: CHAT_DB_NAME
              value: "chat"
            - name: CHAT_DB_USER
              value: "chat"
            - name: CHAT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: CHAT_DB_PASSWORD
            # seven services share one db.t4g.micro (max_connections about
            # 110): 7 x 5 x 2 replicas stays under it (DP19)
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            # the push fanout's broker login (issue #305); host, port and
            # user come from foc-config like the other RabbitMQ clients
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: RABBITMQ_PASSWORD
            - name: CHAT_WS_ALLOWED_ORIGINS
              value: "https://__PUBLIC_HOST__"
            - name: CHAT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: CHAT_INTERNAL_TOKEN
            - name: CHAT_RETENTION_DAYS
              value: "30"
            - name: CHAT_PURGE_CRON
              value: "0 0 3 * * *"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
