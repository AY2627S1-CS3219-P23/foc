# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: chat-service Deployment + ClusterIP Service; env as in compose.yaml
# with cloud values (in-cluster hostnames, public origin, Gmail SMTP
# for user-service), secrets from the ESO-synced foc-secrets.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-05, Claude Code (Opus 5.5), issue #48 (DP10): RABBITMQ_PASSWORD
# from foc-secrets (host/port/user come from foc-config) for the
# cross-replica STOMP fanout over AMQP (team decision, Leong Wei Zhi via
# options Q&A). Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: foc
spec:
  selector:
    app: chat-service
  ports:
    - port: 8080
---
# no replicas: the HorizontalPodAutoscaler in hpa.yaml owns the count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: chat-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-chat-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: CHAT_DB_HOST
              value: "chat-db"
            - name: CHAT_DB_PORT
              value: "5432"
            - name: CHAT_DB_NAME
              value: "chat"
            - name: CHAT_DB_USER
              value: "chat"
            - name: CHAT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: CHAT_DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            - name: CHAT_WS_ALLOWED_ORIGINS
              value: "http://__PUBLIC_HOST__"
            - name: CHAT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: CHAT_INTERNAL_TOKEN
            - name: CHAT_RETENTION_DAYS
              value: "30"
            - name: CHAT_PURGE_CRON
              value: "0 0 3 * * *"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
