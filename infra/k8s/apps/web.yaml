# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: the web SPA (nginx, static build with the public gateway URLs baked
# in at image build time by the deploy workflow).
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review (Sinnez1): the pod
# template carries the foc-config hash as an annotation (set by deploy.sh).
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP21,
# Leong Wei Zhi, options Q&A): soft spread of the replicas across nodes.
# Author review: Leong Wei Zhi, pending pull request review.
# PR #323 review (Copilot), team decision DP21 (Leong Wei Zhi): rolling
# update without surge (maxSurge 0, maxUnavailable 1); revised on the
# Claude reviewer's round to maxSurge 1, maxUnavailable 0.
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: foc
spec:
  selector:
    app: web
  ports:
    - port: 80
---
# no replicas: the HorizontalPodAutoscaler in hpa.yaml owns the count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: foc
spec:
  selector:
    matchLabels:
      app: web
  # a surge pod first, the old one stops once it is Ready: no outage per
  # deploy (DP21, PR #323 review). The pod is small; it waits Pending only
  # when every node is full, bounded by deploy.sh's deadline. No database,
  # so the backends' connection budget does not apply
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
      annotations:
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      # replicas prefer different nodes, but still schedule when only one
      # node has room (DP21); pod-template-hash keeps a rollout's old
      # pods out of the count
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
          matchLabelKeys:
            - pod-template-hash
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/ay2627s1-cs3219-p23/foc-web
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: foc-config
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 20
