# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: the OpenResty API gateway; UPSTREAM_SUFFIX and a fully qualified
# REDIS_HOST because the nginx resolver ignores search domains.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: the pod template
# carries the foc-secrets version as an annotation (set by deploy.sh);
# second round (Sinnez1): the foc-config hash too.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-10, Claude Code (Opus 5.5), issue #48 (team decision DP21,
# Leong Wei Zhi, options Q&A): soft spread of the replicas across nodes.
# Author review: Leong Wei Zhi, pending pull request review.
# PR #323 review (Copilot), team decision DP21 (Leong Wei Zhi): rolling
# update without surge (maxSurge 0, maxUnavailable 1).
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: foc
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
---
# no replicas: the HorizontalPodAutoscaler in hpa.yaml owns the count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: foc
spec:
  selector:
    matchLabels:
      app: gateway
  # no surge pod (DP21, PR #323 review): a rollout never waits on memory
  # for a second pod; at one replica the pod is stopped before its
  # replacement starts, so each deploy is a few seconds' outage and
  # the gateway's open WebSockets drop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      # replicas prefer different nodes, but still schedule when only one
      # node has room (DP21); pod-template-hash keeps a rollout's old
      # pods out of the count
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
          matchLabelKeys:
            - pod-template-hash
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: gateway
          image: ghcr.io/ay2627s1-cs3219-p23/foc-gateway
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            - name: UPSTREAM_SUFFIX
              value: ".foc.svc.cluster.local"
            - name: REDIS_HOST
              value: "redis.foc.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
