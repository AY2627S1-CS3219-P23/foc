# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: notification-service Deployment + ClusterIP Service; env as in compose.yaml
# with cloud values (in-cluster hostnames, public origin, Gmail SMTP
# for user-service), secrets from the ESO-synced foc-secrets.
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/deployment.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #302 review: the pod template
# carries the foc-secrets version as an annotation (set by deploy.sh);
# second round (Sinnez1): the foc-config hash too.
# Author review: Leong Wei Zhi, pending pull request review.
# Same day, review follow-up: replicas pinned to 1 (DP10, issue #305).
# Same day, issue #48 (HTTPS): the WebSocket origin is https (DP19, DP21).
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: foc
spec:
  selector:
    app: notification-service
  ports:
    - port: 8080
---
# one replica and no HPA (DP10): a STOMP push reaches only the replica
# that holds the browser's socket; issue #305 tracks cross-replica delivery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: foc
spec:
  replicas: 1
  # a deploy must not overlap two pods either (DP10: one socket-holding
  # replica), so the old pod stops before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: notification-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-notification-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: NOTIFICATION_DB_HOST
              value: "notification-db"
            - name: NOTIFICATION_DB_PORT
              value: "5432"
            - name: NOTIFICATION_DB_NAME
              value: "notification"
            - name: NOTIFICATION_DB_USER
              value: "notification"
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: NOTIFICATION_DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            - name: NOTIFICATION_RETRY_TTL_MS
              value: "10000"
            - name: NOTIFICATION_RETRY_MAX_ATTEMPTS
              value: "3"
            - name: NOTIF_RETENTION_DAYS
              value: "30"
            - name: NOTIF_PURGE_CRON
              value: "0 0 3 * * *"
            - name: NOTIFICATION_WS_ALLOWED_ORIGINS
              value: "https://__PUBLIC_HOST__"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
