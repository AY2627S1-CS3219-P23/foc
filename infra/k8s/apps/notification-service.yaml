---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: foc
spec:
  selector:
    app: notification-service
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: foc
spec:
  selector:
    matchLabels:
      app: notification-service
  # no surge pod: a rollout replaces one replica at a time, so it never
  # needs memory or database connections beyond HPA max (DP21, PR #323
  # review)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        # set by deploy.sh to the foc-secrets resourceVersion: changed
        # values roll the pods together with a new image tag
        foc/secrets-version: "__SECRETS_VERSION__"
        # the rendered foc-config, hashed by deploy.sh: a config change
        # rolls the pods too
        foc/config-hash: "__CONFIG_HASH__"
    spec:
      # replicas prefer different nodes, but still schedule when only one
      # node has room (DP21); pod-template-hash keeps a rollout's old
      # pods out of the count
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: notification-service
          matchLabelKeys:
            - pod-template-hash
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: notification-service
          image: ghcr.io/ay2627s1-cs3219-p23/foc-notification-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - name: NOTIFICATION_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: DB_HOST
            - name: NOTIFICATION_DB_PORT
              value: "5432"
            - name: NOTIFICATION_DB_NAME
              value: "notification"
            - name: NOTIFICATION_DB_USER
              value: "notification"
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: NOTIFICATION_DB_PASSWORD
            # seven services share one db.t4g.micro (max_connections about
            # 110): 7 x 5 x 3 replicas (HPA max) is 105, accepted; a rollout
            # adds no surge pod (strategy below, DP21), and one idle
            # connection per pod keeps a fresh pod light (DP19)
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: JWT_SECRET
            - name: NOTIFICATION_RETRY_TTL_MS
              value: "10000"
            - name: NOTIFICATION_RETRY_MAX_ATTEMPTS
              value: "3"
            - name: NOTIF_RETENTION_DAYS
              value: "30"
            - name: NOTIF_PURGE_CRON
              value: "0 0 3 * * *"
            - name: NOTIFICATION_WS_ALLOWED_ORIGINS
              value: "https://__PUBLIC_HOST__"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
