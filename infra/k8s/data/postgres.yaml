# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5 cloud deployment).
# Scope: one Postgres StatefulSet per service (database-per-service, as in
# compose: supplier on postgres:16, the rest on postgres:17), local-path
# volumes; Services keep compose's hostnames (user-db, ...).
# Team decisions (Leong Wei Zhi, 2026-11-05, options Q&A, recorded in
# docs/architecture.md); values mirror compose.yaml's defaults.
# Author review: Leong Wei Zhi, pending pull request review.
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: foc
spec:
  clusterIP: None
  selector:
    app: user-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: foc
spec:
  serviceName: user-db
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "user"
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-secrets
                  key: USER_DB_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "user"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
