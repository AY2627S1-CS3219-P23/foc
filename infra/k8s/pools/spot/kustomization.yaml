# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-10, issue #48 (N5 cloud deployment).
# Scope: the Spot half of every service (team decision DP22, Leong Wei
# Zhi, options Q&A, recorded in docs/deployment.md): <svc>-spot on the
# Spot nodes, its count owned by the HPA in hpa.yaml (1 to 2).
# Author review: Leong Wei Zhi, pending pull request review.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
nameSuffix: -spot
# in the selector too, so <svc>-spot and <svc>-stable never select each
# other's pods; the Services and PDBs select app alone and see both
labels:
  - pairs:
      foc.dev/pool: spot
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          foc.dev/pool: spot
