# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Fable 5), 2026-10-11, issue #151 (gateway half).
# Scope: API gateway routing + auth per the team's decisions (Leong Wei
# Zhi, 2026-10-11, options Q&A, recorded in docs/gateway.md): path-prefix
# routing /api/<service>/** to every backend, bearer tokens verified and
# denylist-checked by lua/auth.lua on each proxied route, anonymous
# requests passed through untouched, the notification WebSocket proxied
# with upgrade headers.
# PR #176 review (@Sinnez1): the public-auth skip moved from a raw
# request_uri match in Lua into dedicated location blocks — nginx
# matches locations on the NORMALIZED URI, so dot-segment or
# percent-encoded paths can no longer route one way while being
# auth-checked another. Same round: proxy headers repeated per location
# (nginx drops inherited proxy_set_header once a location defines any),
# gateway-origin errors (404 and proxy 502/504) answer problem+json
# with the CORS origin header like the Lua 401s, and the order stub
# builds its body with cjson instead of string concatenation.
# Reviewed by: Leong Wei Zhi (via pull request).
# 2026-10-17, Claude Code (Opus 5.5), Aung Ko Khant: the reserved
# /api/order/ stub replaced with a proxied location like credit's, now
# that order-service exists (the replacement the stub's comment and G3
# anticipated).
# 2026-10-26, Claude Code (Sonnet 5.5), issue #225 (N8.5, D12): /api/supplier/purge
# answers 404 from outside — the internal purge cleanup is not a public route
# (option B of the author's C+B choice; supplier-service also requires a
# SERVICE token).

worker_processes auto;

# nginx clears the process environment for workers; without these,
# os.getenv() in Lua returns nil
env JWT_SECRET;
env WEB_ALLOWED_ORIGIN;

error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    init_by_lua_block {
        -- fail at startup, not on the first request, like the Java
        -- verifiers do (JwtIssuer/JwtVerifier's 32-byte check)
        JWT_SECRET = os.getenv("JWT_SECRET")
        if not JWT_SECRET or #JWT_SECRET < 32 then
            error("JWT_SECRET must be set and at least 32 bytes for HS256")
        end
        WEB_ALLOWED_ORIGIN = os.getenv("WEB_ALLOWED_ORIGIN")
            or "http://localhost:5173"
        -- small clock-skew allowance for the exp check, matching the
        -- tolerance a distributed deployment needs
        require("resty.jwt-validators").set_system_leeway(30)
    }

    # WebSocket upgrade passthrough (notification STOMP/SockJS): forward
    # the Upgrade handshake when the client sends one, plain keep-alive
    # otherwise
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Compose's embedded DNS. Resolving upstream names per request (via
    # the variables below) instead of once at startup means the gateway
    # boots even while a backend is down and keeps routing after a
    # single service is rebuilt/recreated with a new container IP.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8080;

        # Gateway-generated proxy errors (backend down/restarting under
        # the per-request-DNS design) answer like the Lua 401s do:
        # problem+json with the CORS origin header, so the SPA can read
        # the status instead of seeing a blocked response (PR #176
        # review, @Sinnez1).
        error_page 502 504 @gateway_error;

        # NOTE: proxy_set_header does NOT inherit once a location sets
        # any header of its own, so the three standard headers are
        # repeated in every proxied location rather than set here
        # (PR #176 review, @Sinnez1 — the notification location's
        # Upgrade headers were silently cancelling them).

        # ---- user-service ------------------------------------------
        # The public auth routes mirror JwtAuthenticationFilter's
        # UNFILTERED matcher (issue #91): they never read the
        # Authorization header, so a stale token stored by the SPA can
        # never block the login/sign-up that would replace it. Location
        # blocks, not a Lua path match: nginx picks locations on the
        # normalized URI, so /api/user/auth/../users/me matches the
        # protected /api/user/ block below, never this one (PR #176
        # review, @Sinnez1 — the raw-request_uri match was bypassable).
        location /api/user/auth/ {
            set $upstream user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ...except logout, which is exactly the route that needs its
        # token verified (the filter's LOGOUT carve-out)
        location = /api/user/auth/logout {
            access_by_lua_file lua/auth.lua;
            set $upstream user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # the filter's other UNFILTERED path: health checks carry no
        # credentials, and a bad token must not fail them
        location = /api/user/actuator/health {
            set $upstream user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/user/ {
            access_by_lua_file lua/auth.lua;
            set $upstream user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- supplier-service --------------------------------------
        # Internal only (issue #225, D12): /purge/** is user-service's
        # account-purge cleanup, called over the compose network, never
        # through here. ^~ beats the proxy block below, and nginx matches
        # on the normalized URI, so encoded or dot-segment spellings land
        # here too. supplier-service additionally requires a SERVICE token.
        location ^~ /api/supplier/purge {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.status = ngx.HTTP_NOT_FOUND
                ngx.header["Content-Type"] = "application/problem+json"
                ngx.header["Access-Control-Allow-Origin"] = WEB_ALLOWED_ORIGIN
                ngx.say(cjson.encode({
                    type = "about:blank",
                    title = "Not Found",
                    status = 404,
                    detail = "No such route on the gateway",
                    instance = ngx.var.request_uri,
                }))
                return ngx.exit(ngx.HTTP_NOT_FOUND)
            }
        }

        location /api/supplier/ {
            access_by_lua_file lua/auth.lua;
            set $upstream supplier-service;
            rewrite ^/api/supplier/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- credit-service ----------------------------------------
        location /api/credit/ {
            access_by_lua_file lua/auth.lua;
            set $upstream credit-service;
            rewrite ^/api/credit/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- notification-service ----------------------------------
        # Additionally carries the STOMP/SockJS WebSocket (/ws and its
        # SockJS sub-paths). The CONNECT-frame JWT inside the socket is
        # the notification service's to verify — the SockJS HTTP
        # requests carry no Authorization header, so auth.lua passes
        # them through (decision G5).
        location /api/notification/ {
            access_by_lua_file lua/auth.lua;
            set $upstream notification-service;
            rewrite ^/api/notification/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # idle STOMP connections heartbeat at 10 s; never cut them
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # SockJS xhr_streaming needs unbuffered responses
            proxy_buffering off;
        }

        # ---- order-service -----------------------------------------
        location /api/order/ {
            access_by_lua_file lua/auth.lua;
            set $upstream order-service;
            rewrite ^/api/order/(.*)$ /$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # anything that isn't a known /api prefix
        location / {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.status = ngx.HTTP_NOT_FOUND
                ngx.header["Content-Type"] = "application/problem+json"
                ngx.header["Access-Control-Allow-Origin"] = WEB_ALLOWED_ORIGIN
                ngx.say(cjson.encode({
                    type = "about:blank",
                    title = "Not Found",
                    status = 404,
                    detail = "No such route on the gateway",
                    instance = ngx.var.request_uri,
                }))
                return ngx.exit(ngx.HTTP_NOT_FOUND)
            }
        }

        # named handler for the error_page above: keeps the proxy error
        # status, adds the problem+json shape + CORS origin header
        location @gateway_error {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local titles = {
                    [502] = "Bad Gateway",
                    [504] = "Gateway Timeout",
                }
                ngx.header["Content-Type"] = "application/problem+json"
                ngx.header["Access-Control-Allow-Origin"] = WEB_ALLOWED_ORIGIN
                ngx.say(cjson.encode({
                    type = "about:blank",
                    title = titles[ngx.status] or "Bad Gateway",
                    status = ngx.status,
                    detail = "the upstream service is unavailable (it may be starting or restarting)",
                    instance = ngx.var.request_uri,
                }))
                return ngx.exit(ngx.status)
            }
        }
    }
}
