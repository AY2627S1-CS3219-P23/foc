# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5.3.3 automated
# deployment).
# Scope: build the nine images for linux/amd64, push them to GHCR, and roll
# them out on the cluster (team decisions: GHCR, OIDC role in the sandbox
# account — Leong Wei Zhi, 2026-11-05, options Q&A; infra/README.md has the
# runbook).
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #289 review findings: the host
# checks out the target commit before deploy.sh runs (the stale copy used
# to run), and the poll covers the whole 60 min executionTimeout. Author
# review: Leong Wei Zhi, pending pull request review.
# PR #302 review: a poll error other than the transient
# InvocationDoesNotExist fails the job at once. Second round (Sinnez1):
# image tags carry the run id, and the poll keeps stderr apart from the
# status.
# 2026-11-08, Claude Code (Fable 5.1), issue #48 (HTTPS): the web bundle's
# URLs are https; PUBLIC_HOST is the site's hostname (DP17, DP18). Author
# review: Leong Wei Zhi, pending pull request review.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform, DP8): the
# rollout job runs deploy.sh itself against the EKS cluster (kubectl under
# an access entry) instead of sending it to a host over SSM; CLUSTER_NAME
# replaces INSTANCE_ID. Author review: Leong Wei Zhi, pending pull request
# review.
#
# Manual trigger only, from main (the OIDC role trusts main alone). Needs
# the repo variables AWS_ROLE_ARN, AWS_REGION, CLUSTER_NAME and PUBLIC_HOST
# (the hostname, served over https by the load balancer) from
# `terraform output`.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ay2627s1-cs3219-p23
  # one tag per workflow run: a re-run of Deploy at the same commit still
  # rolls every Deployment and pulls a rebuilt image (same-commit tags
  # would be cached on the node)
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        image:
          - user-service
          - supplier-service
          - order-service
          - credit-service
          - notification-service
          - rating-service
          - chat-service
          - gateway
          - web
    runs-on: ubuntu-latest
    name: image (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # same contexts as ci.yml's docker job; the web bundle gets the
      # public gateway URLs baked in (Vite inlines VITE_* at build time)
      - name: Resolve build context
        id: meta
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          case "${{ matrix.image }}" in
            web)
              test -n "$PUBLIC_HOST" || { echo "PUBLIC_HOST repo variable is not set"; exit 1; }
              echo "context=web" >> "$GITHUB_OUTPUT"
              echo "file=web/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                for svc in user supplier order credit notification rating chat; do
                  echo "VITE_$(echo "$svc" | tr a-z A-Z)_SERVICE_URL=https://$PUBLIC_HOST/api/$svc"
                done
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            gateway)
              echo "context=gateway" >> "$GITHUB_OUTPUT"
              echo "file=gateway/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/foc-${{ matrix.image }}:${{ env.IMAGE_TAG }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,scope=deploy-${{ matrix.image }},mode=max

  rollout:
    needs: images
    runs-on: ubuntu-latest
    # deploy.sh shares a 45-min deadline across the rollouts; the Helm
    # install and the db-init Job have their own 10-min waits
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # kubectl and helm are preinstalled on ubuntu-latest; the deploy role
      # is cluster admin through an EKS access entry (infra/terraform/eks.tf)
      - name: Run deploy.sh against the cluster
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          set -euo pipefail
          test -n "$CLUSTER_NAME" || { echo "CLUSTER_NAME repo variable is not set"; exit 1; }
          test -n "$PUBLIC_HOST" || { echo "PUBLIC_HOST repo variable is not set"; exit 1; }
          bash infra/k8s/deploy.sh "$IMAGE_TAG" "$PUBLIC_HOST" "$CLUSTER_NAME"
