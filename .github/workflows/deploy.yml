# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-11-05, issue #48 (N5.3.3 automated
# deployment).
# Scope: build the nine images for linux/amd64, push them to GHCR, and roll
# them out on the cluster (team decisions: GHCR, OIDC role in the sandbox
# account — Leong Wei Zhi, 2026-11-05, options Q&A; infra/README.md has the
# runbook).
# Author review: Leong Wei Zhi, pending pull request review.
# 2026-11-08, Claude Code (Fable 5.1), PR #289 review findings: the host
# checks out the target commit before deploy.sh runs (the stale copy used
# to run), and the poll covers the whole 60 min executionTimeout. Author
# review: Leong Wei Zhi, pending pull request review.
# PR #302 review: a poll error other than the transient
# InvocationDoesNotExist fails the job at once. Second round (Sinnez1):
# image tags carry the run id, and the poll keeps stderr apart from the
# status.
# 2026-11-08, Claude Code (Fable 5.1), issue #48 (HTTPS): the web bundle's
# URLs are https; PUBLIC_HOST is the site's hostname (DP17, DP18). Author
# review: Leong Wei Zhi, pending pull request review.
# 2026-11-09, Claude Code (Fable 5.1), issue #48 (EKS re-platform, DP8): the
# rollout job runs deploy.sh itself against the EKS cluster (kubectl under
# an access entry) instead of sending it to a host over SSM; CLUSTER_NAME
# replaces INSTANCE_ID. Author review: Leong Wei Zhi, pending pull request
# review.
# 2026-11-09, Claude Code (Opus 5.5), issue #48 (continuous deployment,
# DP20, team decisions Leong Wei Zhi, options Q&A): runs by itself once CI
# succeeds on a push to main, skips docs-only changes, builds only the
# images whose sources changed since the commit running in the cluster and
# retags the others. Author review: Leong Wei Zhi, pending pull request
# review.
# PR #317 review (Claude reviewer, Copilot): an automatic run older than
# the commit already live deploys nothing (out-of-order CI runs).
#
# Runs after every successful CI run on a push to main, or by hand from
# main (the OIDC role trusts main alone; a workflow_run job runs on main).
# Needs the repo variables AWS_ROLE_ARN, AWS_REGION, CLUSTER_NAME and
# PUBLIC_HOST (the hostname, served over https by the load balancer) from
# `terraform output`.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Build all nine images (after PUBLIC_HOST changed, which the diff cannot see)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ay2627s1-cs3219-p23
  # the commit CI passed on, or main's head for a dispatch (github.sha of a
  # workflow_run run is main's head when it starts, maybe a later commit)
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # one tag per workflow run: a re-run of Deploy at the same commit still
  # rolls every Deployment and pulls a rebuilt image (same-commit tags
  # would be cached on the node)
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}

jobs:
  # which images changed since the commit the cluster runs (DP20)
  plan:
    # CI on a push to this repository's main, not a pull request whose
    # branch happens to be called main
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
      # a dispatch always deploys (secrets and config roll with it)
      deploy: ${{ github.event_name == 'workflow_dispatch' || steps.plan.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0 # the diff starts at the commit the cluster runs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Compare with the cluster
        id: plan
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          REBUILD_ALL: ${{ inputs.rebuild_all == true }}
          # CI runs on main can finish out of order: a first automatic
          # attempt older than the live commit must not roll it back. A
          # dispatch or a re-run (rollback) may deploy an older commit
          NEWER_ONLY: ${{ github.event_name == 'workflow_run' && github.run_attempt == 1 }}
        run: |
          set -euo pipefail
          test -n "$CLUSTER_NAME" || { echo "CLUSTER_NAME repo variable is not set"; exit 1; }
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" >/dev/null
          bash infra/k8s/changed-images.sh "$TARGET_SHA" "$REBUILD_ALL" "$NEWER_ONLY" | tee -a "$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && needs.plan.outputs.build != '[]'
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ubuntu-latest
    name: image (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # same contexts as ci.yml's docker job; the web bundle gets the
      # public gateway URLs baked in (Vite inlines VITE_* at build time)
      - name: Resolve build context
        id: meta
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          case "${{ matrix.image }}" in
            web)
              test -n "$PUBLIC_HOST" || { echo "PUBLIC_HOST repo variable is not set"; exit 1; }
              echo "context=web" >> "$GITHUB_OUTPUT"
              echo "file=web/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                for svc in user supplier order credit notification rating chat; do
                  echo "VITE_$(echo "$svc" | tr a-z A-Z)_SERVICE_URL=https://$PUBLIC_HOST/api/$svc"
                done
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            gateway)
              echo "context=gateway" >> "$GITHUB_OUTPUT"
              echo "file=gateway/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/foc-${{ matrix.image }}:${{ env.IMAGE_TAG }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,scope=deploy-${{ matrix.image }},mode=max

  # unchanged images get this run's tag too, so deploy.sh still applies
  # one tag to every Deployment
  retag:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && needs.plan.outputs.retag != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag from the live tags
        env:
          RETAG: ${{ needs.plan.outputs.retag }}
        run: |
          set -euo pipefail
          jq -r '.[] | "\(.image) \(.from)"' <<<"$RETAG" | while read -r image from; do
            docker buildx imagetools create \
              -t "$REGISTRY/foc-$image:$IMAGE_TAG" "$REGISTRY/foc-$image:$from"
          done

  rollout:
    needs: [plan, images, retag]
    # images or retag may be skipped (nothing to build, or nothing to retag)
    if: >-
      !cancelled() && needs.plan.outputs.deploy == 'true' &&
      needs.images.result != 'failure' && needs.retag.result != 'failure'
    runs-on: ubuntu-latest
    # deploy.sh shares one 50-min deadline across the Helm install, the
    # db-init Job and every rollout, so it fails by itself before this
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # kubectl and helm are preinstalled on ubuntu-latest; the deploy role
      # is cluster admin through an EKS access entry (infra/terraform/eks.tf)
      - name: Run deploy.sh against the cluster
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          set -euo pipefail
          test -n "$CLUSTER_NAME" || { echo "CLUSTER_NAME repo variable is not set"; exit 1; }
          test -n "$PUBLIC_HOST" || { echo "PUBLIC_HOST repo variable is not set"; exit 1; }
          bash infra/k8s/deploy.sh "$IMAGE_TAG" "$PUBLIC_HOST" "$CLUSTER_NAME"
