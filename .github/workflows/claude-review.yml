# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Fable 5), 2026-10-16.
# Scope: automated Claude Code review on pull requests, following the
# anthropics/claude-code-action "Automatic PR Code Review" recipe.
# Reviewed by: Leong Wei Zhi (via pull request).

# Cost levers: authenticates with a Claude subscription OAuth token
# (CLAUDE_CODE_OAUTH_TOKEN secret, generated via `claude setup-token`)
# instead of per-token API billing; runs claude-sonnet-5-5 (drop to
# claude-haiku-5-5 below if quota becomes a concern); skips drafts and
# docs-only changes; cancels superseded runs on new pushes.
#
# Do NOT mark this workflow as a required check — paths-ignore means
# docs-only PRs would wait on a check that never runs.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ai/**'
      - 'data/**'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on what automated tooling
            does not already cover (ESLint/Prettier and the Java build
            run in CI):
            - correctness bugs and unhandled edge cases
            - security issues (authz checks, JWT/session handling,
              injection, secrets in code)
            - concurrency and transaction problems in the Spring services
            - breaking changes to cross-service contracts (foc-contracts,
              RabbitMQ topology, gateway routes)
            - missing or misleading tests for changed behavior

            Use `gh pr diff` and `gh pr view` to read the change. Post
            each concrete finding as an inline comment on the relevant
            line (use `mcp__github_inline_comment__create_inline_comment`
            with confirmed: true), then post one brief summary comment
            with `gh pr comment`. If nothing is wrong, say so in a single
            short summary comment — do not invent findings or nitpick
            style. This is a CS3219 student project: keep feedback
            proportionate and actionable.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
