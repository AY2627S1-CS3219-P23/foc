spring:
  datasource:
    url: jdbc:h2:mem:supplier;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

supplier:
  web-allowed-origin: http://localhost:5173
  jwt:
    secret: test-secret-0123456789abcdef0123456789abcdef
