# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Sonnet 5), 2026-09-22; revised 2026-09-26.
# Scope: service configuration scaffolded following the
# notification-service pattern — application name, datasource bound to
# the service-owned supplier-db, JPA schema-from-entities, and the
# actuator health endpoint. 2026-09-26 (issue #133): web-allowed-origin
# for CorsConfig, so the browser can call GET /suppliers directly.
# Reviewed by: Ko-Khan (via pull request).
# 2026-09-29, issue #106: JWT secret binding for the JWT verification +
# role gate filter chain (same shared JWT_SECRET as user-service and
# notification-service).
# 2026-11-05, Claude Code (Opus 5.5), issue #48 (DP10): Flyway baseline /
# advisory-locked seeding for multi-replica starts (team decision, Leong
# Wei Zhi via options Q&A): Flyway builds the schema (V1 baseline,
# baseline-on-migrate as in user-service) and Hibernate only validates.
# Author review: Leong Wei Zhi, pending pull request review.

spring:
  application:
    name: supplier-service
  datasource:
    url: jdbc:postgresql://${SUPPLIER_DB_HOST:localhost}:${SUPPLIER_DB_PORT:5432}/${SUPPLIER_DB_NAME:supplier}
    username: ${SUPPLIER_DB_USER:supplier}
    password: ${SUPPLIER_DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); two replicas starting
      # together must not both run ddl-auto against one database
      ddl-auto: validate
    open-in-view: false
  flyway:
    # a database ddl-auto built before Flyway has tables but no history:
    # record it as V1 (the baseline script's schema) and apply V2 onward
    baseline-on-migrate: true
    baseline-version: 1

supplier:
  web-allowed-origin: ${WEB_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    # Shared platform secret (HS256). Empty default so the yaml stays
    # parseable; JwtVerifier turns a missing/short value into a clear
    # startup failure.
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
