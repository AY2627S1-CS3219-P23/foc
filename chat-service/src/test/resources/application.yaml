# AI-assisted (CS3219 AI Usage Policy disclosure):
# Tool: Claude Code (Opus 5.5), 2026-10-31, N6 chat.
# Scope: test configuration: the datasource comes from
# PostgresTestContainer (Flyway builds the schema, as in production),
# Redis points at an unresolvable host (the denylist fails open), and
# fixed test secrets.
# Author review: Ko-Khan, pending pull request review.
# 2026-11-05, Claude Code (Opus 5.5), issue #48 (DP10): RabbitMQ at an
# unresolvable host with the listener off, so the suites need no broker
# (rating-service's pattern) — cross-replica STOMP fanout over AMQP (team
# decision, Leong Wei Zhi via options Q&A). Author review: Leong Wei Zhi,
# pending pull request review.

# This file replaces the main application.yaml on the test classpath
# (same name), so every chat.* setting the beans read is repeated here.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    # no broker in tests: an unresolvable host is harmless, and the push
    # listener stays off; the STOMP test loops pushes back in-process
    host: broker.invalid
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      # no Redis in tests: lookups fail fast and fail open
      host: redis.invalid
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false

chat:
  web-allowed-origin: http://localhost:5173
  websocket:
    allowed-origins: http://localhost:*
  jwt:
    secret: test-secret-0123456789abcdef0123456789abcdef
  internal:
    token: test-internal-token
  message:
    max-text-length: 500
    max-image-bytes: 2097152
  retention:
    days: 30
    # never during a test run: ChatServiceTests calls purge() itself
    purge-cron: "-"

management:
  health:
    redis:
      enabled: false
